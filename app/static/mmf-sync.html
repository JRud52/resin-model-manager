<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyMiniFactory sync · Resin Models</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="sync-page">
<main>
  <h2>MyMiniFactory sync</h2>
  <p id="msg">Waiting for your MyMiniFactory library…</p>
  <p class="muted small" id="hint">Keep the MyMiniFactory tab open while it reads your library.
    If nothing happens, the bookmark saves a file called myminifactory-library.json instead; upload it in Resin Models under MyMiniFactory › Sync.</p>
  <p><a href="/" id="back" class="hidden">Open Resin Models</a></p>
</main>
<script>
// Opened by the sync bookmarklet (static/mmf-bookmarklet.js) from a MyMiniFactory tab.
// Saves the library it sends, then hands it the items still missing full-size images
// and stores the images it reads.
const MMF = /^https:\/\/([a-z0-9-]+\.)*myminifactory\.com$/;
const msg = document.getElementById("msg");
const json = async (url, opts) => {
  const r = await fetch(url, { headers: { "Content-Type": "application/json" }, ...opts });
  const res = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(res.detail || r.statusText);
  return res;
};
let work = Promise.resolve(), summary = "";
function finish(e, text) {
  msg.textContent = text;
  document.getElementById("hint").classList.add("hidden");
  document.getElementById("back").classList.remove("hidden");
  e.source.postMessage({ type: "mmf-done", text: "Resin Models: " + text }, e.origin);
}
async function handle(e) {
  const d = e.data;
  if (d.type === "mmf-progress") msg.textContent = summary ? `${summary} ${d.text}` : d.text;
  if (d.type === "mmf-library") {
    const problems = (d.problems || []).join("; ");
    if (!(d.complete || []).length) summary = "Couldn't read your MyMiniFactory library. " + problems;
    else {
      msg.textContent = `Saving ${d.items.length} items…`;
      try {
        const res = await json("/api/mmf/import", { method: "POST", body: JSON.stringify({ items: d.items, complete: d.complete }) });
        summary = `Synced ${res.total} MyMiniFactory items, ${res.missing} of them not in your library yet.` +
          (problems ? ` Some parts couldn't be read: ${problems}` : "");
      } catch (err) { summary = "Saving failed: " + err.message; }
    }
    let gallery = [];
    try { gallery = await json("/api/mmf/gallery"); } catch {}
    if (!gallery.length) { finish(e, summary); return; }
    msg.textContent = `${summary} Reading full-size images…`;
    e.source.postMessage({ type: "mmf-images", gallery }, e.origin);
  }
  if (d.type === "mmf-gallery") await json("/api/mmf/gallery", { method: "POST", body: JSON.stringify({ items: d.items }) });
  if (d.type === "mmf-images-done") finish(e, summary);
}
window.addEventListener("message", (e) => {
  if (!MMF.test(e.origin) || !e.data) return;
  work = work.then(() => handle(e)).catch((err) => { msg.textContent = "Something went wrong: " + err.message; });
});
if (window.opener) window.opener.postMessage({ type: "mmf-ready" }, "*");
else msg.textContent = "Couldn't connect to the MyMiniFactory tab. If you clicked the sync bookmark, it saves " +
  "myminifactory-library.json in a few seconds; upload it in Resin Models under MyMiniFactory › Sync.";
</script>
</body>
</html>
