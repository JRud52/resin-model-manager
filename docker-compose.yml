# Only folders, your NAS user and the port are set here; everything else is in
# the app's Settings (⚙). In Portainer, set these under the stack's
# "Environment variables"; with plain docker compose, put them in a `.env` file
# next to this one (see .env.example). Unset values use the defaults shown.
services:
  resin-models:
    # Built from main by GitHub Actions (.github/workflows/docker.yml).
    image: ghcr.io/jrud52/resin-model-manager:latest
    container_name: resin-models
    restart: unless-stopped
    # Files the app writes belong to this NAS user (`id -u`, `id -g`).
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${PORT:-8417}:8417"
    volumes:
      # Your existing library. Read-only: the app can never change these files.
      - ${SOURCE_PATH:-/volume1/3d-models}:/source:ro
      # The app's own folder (create it first, owned by your NAS user). The app
      # puts the imported copy in library/ and its database and preview cache
      # in data/. Must be outside SOURCE_PATH.
      - ${STORAGE_PATH:-/volume1/resin-manager}:/storage
