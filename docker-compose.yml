# Only the app's folders, your NAS user and the port are set here; everything
# else is in the app's Settings (⚙). In Portainer, set these under the stack's
# "Environment variables"; with plain docker compose, put them in a `.env` file
# next to this one (see .env.example). Unset values use the defaults shown.
services:
  resin-models:
    # Built from main by GitHub Actions (.github/workflows/docker.yml).
    image: ghcr.io/jrud52/resin-model-manager:latest
    container_name: resin-models
    restart: unless-stopped
    # Files the app writes belong to this NAS user (`id -u`, `id -g`).
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${PORT:-8417}:8417"
    volumes:
      # Create both folders first, owned by your NAS user. They can be on
      # different shares.
      # The app's own data: database, settings and preview image cache.
      - ${DATA_PATH:-/volume1/docker/resin-manager}:/data
      # Your model files: everything you import is copied here.
      - ${LIBRARY_PATH:-/volume1/3d-library}:/library
      # Optional: set SOURCE_PATH to an existing library on the NAS to copy it
      # in from the Import dialog. Read-only, so the app can never change those
      # files. Left unset, an empty placeholder volume is mounted instead.
      - ${SOURCE_PATH:-no-source}:/source:ro

volumes:
  no-source:
